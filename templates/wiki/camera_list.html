{% extends "base_template.html" %}
{% block title %}
{{ _("List of all cameras") }}
{% endblock %}
{% block content %}
<h1>{{ _("List of all cameras") }}</h1>
{% for camera in cameras %}
    <li><a href="{{ url_for('camera_detail', slug=camera.manufacturer, camera_id=camera.id) }}" >{{ camera.name }}</a></li>
{% endfor %}
{% endblock %}
