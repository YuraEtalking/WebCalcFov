{% extends "base_template.html" %}
{% block title %}
{{ _("List of all lenses") }}
{% endblock %}
{% block content %}

<h1>{{ _("List of all lenses") }}</h1>
{% for lens in lenses %}
    <li><a href="{{ url_for('lens_detail', slug=lens.manufacturer, lens_id=lens.id) }}" >{{ lens.name }}</a></li>
{% endfor %}

{% endblock %}
