<div class="gallery">
    {% for image in images %}
        {% if image %}
            {% set image_url = url_for(
                'media',
                storage=image.file['upload_storage'],
                file_id=image.file['file_id']
            ) %}

            <button
                class="gallery-item"
                type="button"
                data-full="{{ image_url }}"
                data-title="{{ image.alt or '' }}"
            >
                <img
                    src="{{ image_url }}"
                    alt="{{ image.alt or image.title or '' }}"
                >
            </button>
        {% endif %}
    {% endfor %}
</div>

<div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Закрыть">×</button>
    <img class="lightbox__image" src="" alt="">

    <div class="lightbox__info">
        <h3 class="lightbox__title"></h3>
        <ul class="lightbox__exif">
            <li class="exif-photographer" hidden><span>Фотограф:</span> <b></b></li>
            <li class="exif-camera" hidden><span>Камера:</span> <b></b></li>
            <li class="exif-lens" hidden><span>Объектив:</span> <b></b></li>
            <li class="exif-iso" hidden><span>ISO:</span> <b></b></li>
            <li class="exif-shutter" hidden><span>Выдержка:</span> <b></b></li>
            <li class="exif-aperture" hidden><span>Диафрагма:</span> <b></b></li>
            <li class="exif-focal" hidden><span>Фокусное:</span> <b></b></li>
        </ul>
    </div>
</div>
